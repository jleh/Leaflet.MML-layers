<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MML WMTS Layers example</title>

    <style type="text/css">
      body {
        padding: 0;
        margin: 0;
      }
      html,
      body,
      #map {
        height: 100%;
      }
    </style>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/proj4@2.22.0/dist/proj4.js"></script>
    <script src="https://unpkg.com/proj4leaflet@1.0.2/src/proj4leaflet.js"></script>
    <script src="../mmlLayers.js"></script>

    <script type="text/javascript">
      var map;

      function init() {
        // Get an API key from MML and open this page as wmts.html?apiKey=YOUR_KEY
        var apiKey = new URLSearchParams(window.location.search).get("apiKey");

        if (!apiKey) {
          console.warn("MML WMTS layers require an API key. Add ?apiKey=YOUR_KEY to the page URL.");
        }

        map = L.map("map", {
          crs: L.TileLayer.MML.get3067Proj()
        }).setView([61, 25], 6);

        var baseLayers = {};
        var overlays = {};

        ["taustakartta", "maastokartta", "selkokartta", "ortokuva"].forEach(function (layer) {
          baseLayers[layer] = L.tileLayer.mml_wmts({ layer: layer, apiKey: apiKey });
        });

        // Property boundaries and IDs are transparent, so they are shown on top of a base layer
        ["kiinteistojaotus", "kiinteistotunnukset"].forEach(function (layer) {
          overlays[layer] = L.tileLayer.mml_wmts({ layer: layer, apiKey: apiKey });
        });

        baseLayers.maastokartta.addTo(map);
        L.control.layers(baseLayers, overlays, { collapsed: false }).addTo(map);
      }
    </script>
  </head>
  <body onload="init();">
    <div id="map"></div>
  </body>
</html>
