<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MML Layers example</title>

    <style type="text/css">
      body {
        padding: 0;
        margin: 0;
      }
      html,
      body,
      #map {
        height: 100%;
      }
    </style>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../mmlLayers.js"></script>

    <script type="text/javascript">
      var map;

      function init() {
        var layers = {
          Taustakartta: L.tileLayer.mml("Taustakartta"),
          Peruskartta: L.tileLayer.mml("Peruskartta"),
          Ilmakuva: L.tileLayer.mml("Ortokuva")
        };

        map = L.map("map").setView([61, 25], 8);
        map.addLayer(layers.Taustakartta);

        L.control.layers(layers).addTo(map);
      }
    </script>
  </head>
  <body onload="init();">
    <div id="map"></div>
  </body>
</html>
